# Windows sin Modo Desarrollador NO puede crear symlinks. El build
# standalone de Next.js copia node_modules a .next/standalone y, en
# modo aislado (symlink-farm .pnpm), intenta recrear symlinks -> falla
# con "EPERM: operation not permitted, symlink". En layout hoisted todo
# son archivos reales, asi que Next.js copia sin symlinks. pnpm 11 lee
# esta clave desde pnpm-workspace.yaml (NO desde .npmrc).
nodeLinker: hoisted

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  onnxruntime-node: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "msgpackr-extract"
  - "onnxruntime-node"
  - "prisma"
  - "protobufjs"
  - "sharp"
  - "unrs-resolver"
